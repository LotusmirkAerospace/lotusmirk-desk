name: Feature request
description: An idea for connectors, the repo tools, or the local setup.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard to do with local AI tools today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Desk do? Mention if this belongs in Repo Hunt, Repo Manager, or connectors.
    validations:
      required: true
