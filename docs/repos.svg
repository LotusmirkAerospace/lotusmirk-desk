  <text x="48" y="182" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a">is-odd@3.0.1</text>
  <rect x="180" y="164" width="58" height="22" rx="4" fill="#e5f4e9"/>
  <text x="194" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#1f7a3a">ready</text>
  <rect x="248" y="164" width="58" height="22" rx="4" fill="#e8f0f7"/>
  <text x="260" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#2f5d8c">In use</text>
  <text x="48" y="214" font-family="system-ui, sans-serif" font-size="14" fill="#1c1c1a">Loaded is-odd in the sandbox.</text>
  <text x="48" y="244" font-family="ui-monospace, monospace" font-size="12" fill="#5e5e58">sandboxes/…/3.0.1</text>
  <rect x="640" y="150" width="288" height="250" rx="4" fill="#ffffff" stroke="#d6d6d0"/>
  <text x="656" y="182" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a">Install and test</text>
