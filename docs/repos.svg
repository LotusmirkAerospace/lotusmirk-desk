  <rect x="656" y="250" width="180" height="32" rx="4" fill="#2f5d8c"/>
  <text x="684" y="271" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff">Install and test</text>
  <text x="32" y="520" font-family="system-ui, sans-serif" font-size="12" fill="#5e5e58">Packages are not installed globally. npm scripts stay disabled.</text>
